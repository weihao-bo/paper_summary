<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Generator - Dataset Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #0d1117;
            --bg-tertiary: #161b22;
            --bg-code: #1a1f29;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-purple: #a371f7;
            --accent-orange: #d29922;
            --accent-pink: #f778ba;
            --accent-cyan: #79c0ff;
            --accent-red: #ff7b72;
            --accent-yellow: #e3b341;
            --d2c-color: #58a6ff;
            --de-color: #a371f7;
            --du-color: #3fb950;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .header .subtitle { color: rgba(255,255,255,0.85); font-size: 0.95rem; }

        /* Stats Section */
        .stats-section {
            padding: 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto 2rem;
        }

        .stat-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-value {
            font-family: 'Fira Code', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }
        .stat-value.d2c { color: var(--d2c-color); }
        .stat-value.de { color: var(--de-color); }
        .stat-value.du { color: var(--du-color); }
        .stat-value.green { color: var(--accent-green); }
        .stat-value.yellow { color: var(--accent-yellow); }
        .stat-value.red { color: var(--accent-red); }

        .stat-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.5rem; }

        /* Charts */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .chart-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .chart-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
        .chart-wrapper { position: relative; height: 280px; }

        /* Filters */
        .filter-section {
            padding: 1rem 2rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .filter-row {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            color: var(--text-primary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover { border-color: var(--accent-blue); }
        .filter-btn.active { border-color: var(--accent-green); background: rgba(63, 185, 80, 0.15); }
        .filter-btn .count { font-family: 'Fira Code', monospace; font-size: 0.7rem; color: var(--accent-cyan); margin-left: 0.3rem; }

        .toolbar {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .search-box input:focus { border-color: var(--accent-blue); }
        .search-box::before { content: ''; position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); font-size: 0.85rem; }

        .result-count { color: var(--text-secondary); font-size: 0.85rem; }

        .per-page-select {
            padding: 0.4rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        /* Main Content */
        .main-content {
            padding: 1.5rem;
            max-width: 1800px;
            margin: 0 auto;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Case Card */
        .case-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .case-header {
            padding: 1rem 1.5rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .case-id {
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .case-badges { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-category { background: rgba(163, 113, 247, 0.2); color: var(--accent-purple); }
        .badge-success { background: rgba(63, 185, 80, 0.2); color: var(--accent-green); }
        .badge-partial { background: rgba(210, 153, 34, 0.2); color: var(--accent-yellow); }
        .badge-failed { background: rgba(255, 123, 114, 0.2); color: var(--accent-red); }

        .case-body { padding: 1.5rem; }

        /* Original Image Section - 左右双栏布局 */
        .original-section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .original-content {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        .original-image-wrapper {
            flex: 0 0 auto;
            max-width: 50%;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title .icon { font-size: 1.2rem; }
        .section-title.d2c { color: var(--d2c-color); }
        .section-title.de { color: var(--de-color); }
        .section-title.du { color: var(--du-color); }

        .image-container {
            background: #fafafa;
            border-radius: 8px;
            padding: 1rem;
            display: inline-block;
            cursor: pointer;
        }

        .image-container img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        /* Case Info Panel */
        .info-panel {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            min-width: 280px;
        }

        .info-panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.6rem 1rem;
            font-size: 0.85rem;
        }

        .info-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-primary);
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
        }

        .info-value.category {
            color: var(--accent-purple);
        }

        .info-value.success {
            color: var(--accent-green);
        }

        .info-value.failed {
            color: var(--accent-red);
        }

        .package-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .package-tag {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: 'Fira Code', monospace;
        }

        /* Task Sections - 垂直堆叠布局 */
        .tasks-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .tasks-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .expand-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .expand-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .task-section {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .task-header {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-header.d2c { background: rgba(88, 166, 255, 0.1); border-left: 3px solid var(--d2c-color); }
        .task-header.de { background: rgba(163, 113, 247, 0.1); border-left: 3px solid var(--de-color); }
        .task-header.du { background: rgba(63, 185, 80, 0.1); border-left: 3px solid var(--du-color); }

        .task-type {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .task-type.d2c { color: var(--d2c-color); }
        .task-type.de { color: var(--de-color); }
        .task-type.du { color: var(--du-color); }

        .task-body { padding: 1rem; }

        /* Task Item */
        .task-item {
            background: var(--bg-code);
            border-radius: 8px;
            margin-bottom: 1.2rem;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: box-shadow 0.2s;
        }

        .task-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.3); }
        .task-item:last-child { margin-bottom: 0; }

        .task-item-header {
            padding: 0.8rem 1rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .task-item-header .task-name {
            font-family: 'Fira Code', monospace;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .task-item-body { padding: 1rem; }

        /* 子任务编号标签 */
        .subtask-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            background: var(--accent-purple);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .subtask-number.de { background: var(--de-color); }
        .subtask-number.du { background: var(--du-color); }

        /* Question/Answer display */
        .qa-block {
            margin-bottom: 1.2rem;
            padding: 0.8rem;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            border-left: 3px solid var(--border-color);
        }

        .qa-block:last-child { margin-bottom: 0; }

        .qa-block.question { border-left-color: var(--accent-blue); background: rgba(88, 166, 255, 0.05); }
        .qa-block.answer { border-left-color: var(--accent-green); background: rgba(63, 185, 80, 0.05); }
        .qa-block.instruction { border-left-color: var(--accent-purple); background: rgba(163, 113, 247, 0.05); }

        .qa-label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
        }

        .qa-label.question { background: rgba(88, 166, 255, 0.2); color: var(--accent-blue); }
        .qa-label.answer { background: rgba(63, 185, 80, 0.2); color: var(--accent-green); }
        .qa-label.instruction { background: rgba(163, 113, 247, 0.2); color: var(--accent-purple); }
        .qa-label.code-label { background: rgba(121, 192, 255, 0.2); color: var(--accent-cyan); }
        .qa-label.reasoning { background: rgba(210, 153, 34, 0.2); color: var(--accent-orange); }

        .qa-label .icon { font-size: 0.9rem; }

        .qa-content {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .qa-content.code {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            max-height: 500px;
            overflow: auto;
        }

        /* Comparison Grid */
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .comparison-item {
            text-align: center;
        }

        .comparison-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .comparison-image {
            background: #fafafa;
            border-radius: 6px;
            padding: 0.5rem;
            cursor: pointer;
        }

        .comparison-image img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }

        /* Collapsible */
        .collapsible-toggle {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            margin-top: 0.5rem;
        }

        .collapsible-toggle:hover { border-color: var(--accent-blue); }

        .collapsible-content {
            display: none;
            margin-top: 0.5rem;
        }

        .collapsible-content.show { display: block; }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            padding: 2rem;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 0.5rem 0.8rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            min-width: 40px;
            text-align: center;
        }

        .page-btn:hover:not(:disabled) { background: var(--accent-blue); border-color: var(--accent-blue); }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-btn.active { background: var(--accent-green); border-color: var(--accent-green); }
        .page-info { color: var(--text-secondary); font-size: 0.9rem; padding: 0 0.5rem; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            cursor: zoom-out;
        }

        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { max-width: 95%; max-height: 95%; object-fit: contain; }
        .modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 2rem; cursor: pointer; }
        .modal-info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; }

        /* No results */
        .no-results { text-align: center; padding: 4rem; color: var(--text-secondary); }
        .no-results .emoji { font-size: 3rem; margin-bottom: 1rem; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        @media (max-width: 900px) {
            .tasks-grid { grid-template-columns: 1fr; }
            .comparison-grid { grid-template-columns: 1fr; }
            .original-content {
                flex-direction: column;
            }
            .original-image-wrapper {
                max-width: 100%;
            }
            .info-panel {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Question Generator - Dataset Visualization</h1>
        <p class="subtitle">D2C / DE / DU Task Analysis</p>
    </header>

    <section class="stats-section">
        <div class="stats-grid" id="stats-grid"></div>
        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">Category Distribution</div>
                <div class="chart-wrapper"><canvas id="categoryChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">Task Success Rate</div>
                <div class="chart-wrapper"><canvas id="taskChart"></canvas></div>
            </div>
        </div>
    </section>

    <section class="filter-section">
        <div class="filter-row" id="category-filters"></div>
        <div class="filter-row" id="status-filters"></div>
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search by ID, category, or content...">
            </div>
            <select class="per-page-select" id="per-page">
                <option value="10">10 / page</option>
                <option value="20" selected>20 / page</option>
                <option value="50">50 / page</option>
            </select>
            <span class="result-count" id="result-count"></span>
        </div>
    </section>

    <div class="main-content">
        <div class="items-list" id="items-list"></div>
    </div>

    <div class="pagination" id="pagination"></div>

    <div class="modal" id="image-modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modal-image">
        <div class="modal-info" id="modal-info"></div>
    </div>

                                        <div class="qa-label code-label"><span class="icon">📌</span> CODE REFERENCE</div>
                                        <div class="qa-content code">${escapeHtml(du.answer.code_reference)}</div>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `}).join('');

                    duHtml = `
                        <div class="task-section">
                            <div class="task-header du">
                                <span class="task-type du">🧠 DU - Diagram Understanding (${tasks.du.items.length} questions)</span>
                            </div>
                            <div class="task-body">${duItems}</div>
                        </div>
                    `;
                }

                // 计算代码行数
                const codeLines = item.code ? item.code.split('\n').length : 0;
                // 生成宏包标签
                const packagesHtml = (item.packages_used || []).map(p =>
                    `<span class="package-tag">${escapeHtml(p)}</span>`
                ).join('');

                return `
                    <div class="case-card" id="${cardId}">
                        <div class="case-header">
                            <span class="case-id">${item.id}</span>
                            <div class="case-badges">
                                <span class="badge badge-category">${item.category}</span>
                                <span class="badge ${statusClass}">${item.processing_status}</span>
                            </div>
                        </div>
                        <div class="case-body">
                            <div class="original-section">
                                <div class="section-title"><span class="icon">📊</span> Original Diagram</div>
                                <div class="original-content">
                                    <div class="original-image-wrapper">
                                        ${originalImg ? `
                                        <div class="image-container" onclick="openModal('${originalImg}', 'Original: ${item.id}')">
                                            <img src="${originalImg}" loading="lazy" onerror="this.parentElement.innerHTML='Image not available'">
                                        </div>
                                        ` : '<div style="color: var(--text-muted)">No image available</div>'}
                                    </div>
                                    <div class="info-panel">
                                        <div class="info-panel-title"><span>📋</span> Case Information</div>
                                        <div class="info-grid">
                                            <span class="info-label">ID</span>
                                            <span class="info-value">${item.id}</span>

                                            <span class="info-label">Category</span>
                                            <span class="info-value category">${item.category || '-'}</span>

                                            <span class="info-label">Source</span>
                                            <span class="info-value">${item.source_file || '-'}</span>

                                            <span class="info-label">Package</span>
                                            <span class="info-value">${item.source_package || '-'}</span>

                                            <span class="info-label">Status</span>
                                            <span class="info-value ${item.processing_status}">${item.processing_status || '-'}</span>

                                            <span class="info-label">Code Lines</span>
                                            <span class="info-value">${codeLines}</span>

                                            <span class="info-label">LaTeX Packages</span>
                                            <div class="package-tags">${packagesHtml || '<span class="info-value">-</span>'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="tasks-toolbar">
                                <button class="expand-btn" onclick="expandAllInCase('${cardId}')">📂 全部展开</button>
                                <button class="expand-btn" onclick="collapseAllInCase('${cardId}')">📁 全部折叠</button>
                            </div>
                            <div class="tasks-grid">
                                ${d2cHtml}
                                ${deHtml}
                                ${duHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('items-list').innerHTML = html;
        }

        function toggleCollapsible(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('show');
        }

        function expandAllInCase(cardId) {
            const card = document.getElementById(cardId);
            if (card) {
                card.querySelectorAll('.collapsible-content').forEach(el => el.classList.add('show'));
            }
        }

        function collapseAllInCase(cardId) {
            const card = document.getElementById(cardId);
            if (card) {
                card.querySelectorAll('.collapsible-content').forEach(el => el.classList.remove('show'));
            }
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let html = `
                <button class="page-btn" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>First</button>
                <button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>
            `;

            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) html += '<span class="page-info">...</span>';

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (endPage < totalPages) html += '<span class="page-info">...</span>';

            html += `
                <button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
                <button class="page-btn" onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>Last</button>
                <span class="page-info">${currentPage} / ${totalPages}</span>
            `;

            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            render();
            window.scrollTo({ top: document.querySelector('.filter-section').offsetTop, behavior: 'smooth' });
        }

        function openModal(src, info) {
            document.getElementById('modal-image').src = src;
            document.getElementById('modal-info').textContent = info;
            document.getElementById('image-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('image-modal').classList.remove('active');
        }

        document.getElementById('image-modal').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
