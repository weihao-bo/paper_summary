<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciDiagram Task Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Base palette - deep ocean */
            --bg-base: #080c12;
            --bg-card: #0c1018;
            --bg-elevated: #121820;
            --bg-hover: #1a222c;
            --bg-input: #0e1420;

            /* Borders */
            --border: #1e2832;
            --border-subtle: #161e28;
            --border-focus: #3b82f6;

            /* Text hierarchy */
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-dim: #475569;

            /* Task accent colors */
            --d2c: #3b82f6;
            --d2c-bg: rgba(59, 130, 246, 0.08);
            --d2c-border: rgba(59, 130, 246, 0.25);

            --de: #8b5cf6;
            --de-bg: rgba(139, 92, 246, 0.08);
            --de-border: rgba(139, 92, 246, 0.25);

            --du: #10b981;
            --du-bg: rgba(16, 185, 129, 0.08);
            --du-border: rgba(16, 185, 129, 0.25);

            /* Status */
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;

            /* DE Dimension colors */
            --dim-color: #f472b6;
            --dim-color-bg: rgba(244, 114, 182, 0.15);
            --dim-text: #38bdf8;
            --dim-text-bg: rgba(56, 189, 248, 0.15);
            --dim-scope: #a78bfa;
            --dim-scope-bg: rgba(167, 139, 250, 0.15);
            --dim-layout: #fbbf24;
            --dim-layout-bg: rgba(251, 191, 36, 0.15);

            /* Accent */
            --accent: #06b6d4;
            --accent-dim: rgba(6, 182, 212, 0.15);

            /* Spacing */
            --sidebar-width: 160px;
            --header-height: 56px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== HEADER ========== */
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header h1 .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--d2c), var(--de));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .header-stats {
            display: flex;
            gap: 2rem;
        }

        .header-stat {
            text-align: right;
        }

        .header-stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
        }

        .header-stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ========== STATS SECTION ========== */
        .stats-section {
            padding: 1.5rem 2rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .stats-container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .stat-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1rem;
            transition: border-color 0.2s;
        }

        .stat-card:hover { border-color: var(--border); }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .stat-value.d2c { color: var(--d2c); }
        .stat-value.de { color: var(--de); }
        .stat-value.du { color: var(--du); }
        .stat-value.total { color: var(--accent); }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .chart-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1rem;
        }

        .chart-title {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .chart-wrapper { height: 160px; }

        /* ========== SUBTASK STATS (Always Expanded) ========== */
        .subtask-stats {
            max-width: 1600px;
            margin: 1.5rem auto 0;
            padding: 0 2rem;
        }

        .subtask-panel {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .subtask-panel-header {
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .subtask-panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .subtask-panel-body {
            padding: 1.25rem;
        }

        /* Main charts section: bar + pie side by side */
        .subtask-charts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .subtask-chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }

        .subtask-chart-card.de { border-left: 3px solid var(--de); }
        .subtask-chart-card.du { border-left: 3px solid var(--du); }

        .subtask-chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .subtask-chart-title {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .subtask-chart-total {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        /* Charts container: bar + pie */
        .subtask-chart-content {
            display: grid;
            grid-template-columns: 1fr 140px;
            gap: 1rem;
            align-items: start;
        }

        .subtask-bar-wrapper {
            height: 220px;
        }

        .subtask-pie-wrapper {
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .subtask-pie-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            text-align: center;
        }

        .subtask-list {
            margin-top: 0.75rem;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.75rem;
            border-top: 1px solid var(--border-subtle);
            padding-top: 0.5rem;
        }

        .subtask-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .subtask-list-item:hover {
            background: var(--bg-hover);
        }

        .subtask-list-item .name {
            color: var(--text-secondary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .subtask-list-item .count {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            margin-left: 0.5rem;
        }

        .subtask-list-item .percent {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-left: 0.35rem;
            min-width: 45px;
            text-align: right;
        }

        /* Category Breakdown with Mini Pie Charts */
        .category-breakdown {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }

        .category-breakdown-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .category-breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1rem;
        }

        .category-breakdown-item {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 0.75rem;
        }

        .category-breakdown-item-header {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-breakdown-item-header .cat-count {
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
        }

        /* Two-column layout: DE pie | DU pie */
        .category-breakdown-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .category-chart-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .category-chart-section-title {
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.4rem;
        }

        .category-chart-section-title.de { color: var(--de); }
        .category-chart-section-title.du { color: var(--du); }

        .category-pie-wrapper {
            width: 100px;
            height: 100px;
        }

        .category-pie-legend {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 0.3rem;
        }

        .no-data-hint {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            padding: 1rem;
        }

        @media (max-width: 1200px) {
            .subtask-charts {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .subtask-chart-content {
                grid-template-columns: 1fr;
            }
            .subtask-pie-wrapper {
                margin: 0 auto;
            }
            .category-breakdown-charts {
                grid-template-columns: 1fr;
            }
        }

        /* ========== FILTER SECTION ========== */
        .filter-section {
            padding: 0.75rem 2rem;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .filter-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
        }

        .dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            min-width: 180px;
            transition: border-color 0.2s;
        }

        .dropdown-toggle:hover { border-color: var(--border-focus); }
        .dropdown-toggle.active { border-color: var(--success); }

        .dropdown-toggle .text { flex: 1; }
        .dropdown-toggle .arrow {
            font-size: 0.6rem;
            transition: transform 0.2s;
            color: var(--text-muted);
        }
        .dropdown-toggle.open .arrow { transform: rotate(180deg); }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            min-width: 240px;
            width: max-content;
            max-width: 320px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none;
            z-index: 200;
            max-height: 320px;
            overflow-y: auto;
        }

        .dropdown-menu.show { display: block; }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.75rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .dropdown-item:hover { background: var(--bg-hover); }

        .dropdown-item input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--success);
        }

        .dropdown-item .name { flex: 1; font-size: 0.85rem; white-space: nowrap; }
        .dropdown-item .count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
        }

        .dropdown-actions {
            padding: 0.5rem 0.75rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
        }

        .dropdown-actions button {
            flex: 1;
            padding: 0.35rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .dropdown-actions button:hover {
            border-color: var(--border-focus);
            color: var(--text-primary);
        }

        /* Search */
        .search-box {
            position: relative;
        }

        .search-box input {
            width: 240px;
            padding: 0.5rem 0.75rem 0.5rem 2rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus { border-color: var(--border-focus); }
        .search-box input::placeholder { color: var(--text-dim); }

        .search-box::before {
            content: '';
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border: 2px solid var(--text-dim);
            border-radius: 50%;
        }

        .per-page-select {
            padding: 0.5rem 0.75rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .result-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            padding: 1.5rem 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* ========== CASE CARD ========== */
        .case-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .case-header {
            padding: 0.75rem 1rem;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .case-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
        }

        .case-badges { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .badge-category { background: var(--de-bg); color: var(--de); border: 1px solid var(--de-border); }
        .badge-success { background: var(--du-bg); color: var(--du); border: 1px solid var(--du-border); }
        .badge-partial { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.25); }
        .badge-failed { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.25); }
        .badge-render-ok { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.25); }
        .badge-render-fail { background: rgba(251, 146, 60, 0.1); color: #fb923c; border: 1px solid rgba(251, 146, 60, 0.25); }
        .badge-retry { background: rgba(168, 85, 247, 0.1); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.25); }

        /* Case Content - 四列紧凑布局 */
        .case-content {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr 1fr 1fr;
            gap: 0.75rem;
            align-items: start;
            min-height: auto;
        }

        /* Sidebar - 紧凑侧边栏 */
        .sidebar {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem;
            height: fit-content;
        }

        .sidebar-image {
            border-radius: 4px;
            margin-bottom: 0.5rem;
            cursor: zoom-in;
            position: relative;
            display: inline-block;
        }

        .sidebar-image:hover::after {
            content: '🔍';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.5);
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .sidebar-image img {
            max-width: 100%;
            height: auto;
            max-height: 150px;
            display: block;
            border-radius: 4px;
        }

        .sidebar-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 0.65rem;
            padding: 0.2rem 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .info-row:last-child { border-bottom: none; }

        .info-row .label {
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .info-row .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-primary);
            text-align: right;
            word-break: break-all;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-row .value.highlight { color: var(--accent); }

        .package-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            justify-content: flex-end;
        }

        .package-tag {
            background: var(--d2c-bg);
            color: var(--d2c);
            border: 1px solid var(--d2c-border);
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            font-size: 0.65rem;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Sidebar Code - 原始代码折叠块 */
        .sidebar-code {
            margin-top: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .sidebar-code summary {
            padding: 0.3rem 0.5rem;
            background: var(--bg-input);
            cursor: pointer;
            font-size: 0.6rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .sidebar-code summary:hover {
            background: var(--bg-hover);
        }

        .sidebar-code[open] summary {
            border-bottom: 1px solid var(--border);
        }

        .sidebar-code pre {
            margin: 0;
            padding: 0.4rem;
            background: var(--bg-base);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            line-height: 1.3;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 120px;
            overflow-y: auto;
            color: var(--text-secondary);
        }

        /* Task Panel - 紧凑面板 */
        .task-panel {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            min-height: 200px;
        }

        .task-panel.d2c { border-top: 2px solid var(--d2c); }
        .task-panel.de { border-top: 2px solid var(--de); }
        .task-panel.du { border-top: 2px solid var(--du); }

        .panel-header {
            padding: 0.4rem 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
        }

        .panel-header.d2c { background: var(--d2c-bg); }
        .panel-header.de { background: var(--de-bg); }
        .panel-header.du { background: var(--du-bg); }

        .task-type {
            font-weight: 600;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .task-type.d2c { color: var(--d2c); }
        .task-type.de { color: var(--de); }
        .task-type.du { color: var(--du); }

        .task-count {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .panel-body {
            padding: 0.5rem;
        }

        /* D2C specific - 紧凑布局 */
        .d2c-content {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .code-toggle {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.3rem 0.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .code-toggle:hover { border-color: var(--border-focus); }

        .code-toggle .tag {
            font-size: 0.55rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 0.1rem 0.25rem;
            border-radius: 2px;
        }

        .code-toggle .tag.q { background: var(--d2c-bg); color: var(--d2c); }
        .code-toggle .tag.a { background: var(--du-bg); color: var(--du); }
        .code-toggle .tag.r { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .code-toggle .tag.c { background: var(--de-bg); color: var(--de); }

        .code-toggle .text {
            flex: 1;
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .code-toggle .arrow {
            font-size: 0.5rem;
            color: var(--text-dim);
            transition: transform 0.2s;
        }

        .code-toggle.open .arrow { transform: rotate(180deg); }

        .code-content {
            display: none;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.4rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 150px;
            overflow: auto;
        }

        .code-content.show { display: block; }

        .render-preview {
            border-radius: 4px;
            cursor: zoom-in;
            position: relative;
            text-align: center;
            margin: 0.5rem auto;
        }

        .render-preview:hover::after {
            content: '🔍';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.5);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.7rem;
        }

        .render-preview img {
            max-width: 100%;
            height: auto;
            max-height: 150px;
            display: inline-block;
            border-radius: 4px;
        }

        .render-label {
            text-align: center;
            font-size: 0.55rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        /* DE specific - 紧凑网格布局 */
        .de-items {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .de-item {
            flex: 1;
            min-width: 0;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .de-item-header {
            padding: 0.3rem 0.5rem;
            background: var(--de-bg);
            border-bottom: 1px solid var(--de-border);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .de-item-header .num {
            width: 16px;
            height: 16px;
            background: var(--de);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .de-item-header .task-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--de);
            flex-shrink: 0;
            padding: 0.1rem 0.3rem;
            background: rgba(139, 92, 246, 0.15);
            border-radius: 3px;
        }

        .de-item-header .task-name {
            font-size: 0.6rem;
            font-weight: 500;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 120px;
        }

        .de-item-header .badges {
            display: flex;
            gap: 0.2rem;
            margin-left: auto;
            flex-shrink: 0;
        }

        .de-item-header .badge-mini {
            font-size: 0.55rem;
            padding: 0.1rem 0.25rem;
            border-radius: 3px;
        }

        .de-item-header .dim-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            font-weight: 600;
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            flex-shrink: 0;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .dim-badge.dim-color { color: var(--dim-color); background: var(--dim-color-bg); }
        .dim-badge.dim-text { color: var(--dim-text); background: var(--dim-text-bg); }
        .dim-badge.dim-scope { color: var(--dim-scope); background: var(--dim-scope-bg); }
        .dim-badge.dim-layout { color: var(--dim-layout); background: var(--dim-layout-bg); }

        .de-item-header .title {
            flex: 1;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .de-item-body {
            padding: 0.4rem;
        }

        .de-instruction {
            font-size: 0.6rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            padding: 0.3rem;
            background: var(--bg-base);
            border-radius: 3px;
            border-left: 2px solid var(--de);
            max-height: 40px;
            overflow: hidden;
        }
        .de-reasoning {
            font-size: 0.55rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            padding: 0.25rem 0.3rem;
            background: rgba(245, 158, 11, 0.05);
            border-radius: 3px;
            border-left: 2px solid var(--warning);
        }
        .de-reasoning .reasoning-label {
            font-weight: 600;
            color: var(--warning);
            margin-right: 0.3rem;
        }
        .de-reasoning .reasoning-text {
            color: var(--text-secondary);
        }

        .de-question-toggle {
            font-size: 0.55rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.3rem;
            margin-bottom: 0.3rem;
            background: rgba(139, 92, 246, 0.05);
            border-radius: 3px;
            border: 1px dashed var(--de-border);
        }
        .de-question-toggle:hover {
            background: rgba(139, 92, 246, 0.1);
        }
        .de-question-toggle .icon { font-size: 0.7rem; }
        .de-question-content {
            display: none;
            font-size: 0.55rem;
            color: var(--text-secondary);
            padding: 0.4rem;
            margin-bottom: 0.4rem;
            background: var(--bg-base);
            border-radius: 3px;
            border: 1px solid var(--de-border);
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', monospace;
        }
        .de-question-content.show { display: block; }

        .de-render {
            border-radius: 3px;
            cursor: zoom-in;
            position: relative;
            text-align: center;
        }

        .de-render:hover::after {
            content: '🔍';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.5);
            padding: 0.2rem 0.3rem;
            border-radius: 3px;
            font-size: 0.6rem;
        }

        .de-render img {
            max-width: 100%;
            height: auto;
            max-height: 100px;
            display: inline-block;
            border-radius: 3px;
        }

        .de-render-error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px dashed var(--error);
            border-radius: 4px;
            padding: 0.5rem;
            text-align: center;
            color: var(--error);
            font-size: 0.6rem;
        }
        .de-render-error .icon { font-size: 1rem; margin-bottom: 0.25rem; display: block; }
        .de-render-error .msg { color: var(--text-muted); font-size: 0.55rem; margin-top: 0.2rem; }

        /* DE Details - Answer Code 折叠块 */
        .de-details {
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .de-details summary {
            padding: 0.4rem 0.6rem;
            background: var(--bg-base);
            cursor: pointer;
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .de-details summary:hover {
            color: var(--text-secondary);
            background: var(--bg-hover);
        }

        .de-details[open] summary {
            border-bottom: 1px solid var(--border-subtle);
        }

        .de-code {
            margin: 0;
            padding: 0.6rem;
            background: var(--bg-base);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 250px;
            overflow-y: auto;
            color: var(--text-secondary);
        }

        .de-changes {
            padding: 0.5rem 0.6rem;
            border-top: 1px solid var(--border-subtle);
            background: var(--de-bg);
        }

        .de-changes strong {
            font-size: 0.7rem;
            color: var(--de);
            display: block;
            margin-bottom: 0.3rem;
        }

        .de-changes ul {
            margin: 0;
            padding-left: 1.2rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .de-changes li {
            margin-bottom: 0.2rem;
        }

        .de-error {
            margin-top: 0.5rem;
            padding: 0.4rem 0.6rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--error);
        }

        /* DU specific - 紧凑行布局 */
        .du-items {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .du-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.4rem 0.5rem;
        }

        .du-item-header {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.25rem;
        }

        .du-item-header .num {
            width: 16px;
            height: 16px;
            background: var(--du);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .du-item-header .title {
            flex: 1;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .du-item-header .task-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--du);
            flex-shrink: 0;
            padding: 0.1rem 0.3rem;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 3px;
        }

        .du-item-header .task-name {
            font-size: 0.6rem;
            font-weight: 500;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 150px;
        }

        .du-item-header .type {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            color: var(--de);
            background: var(--de-bg);
            border: 1px solid var(--de-border);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
        }

        /* Empty task panel */
        .task-panel.empty {
            min-height: 80px;
            opacity: 0.5;
        }

        .task-panel.empty .panel-body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .du-question {
            font-size: 0.6rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            line-height: 1.4;
            max-height: 2.8em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* DU Answer Row - 紧凑内联布局 */
        .du-answer-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.4rem;
            background: var(--bg-base);
            border-radius: 4px;
            flex-wrap: wrap;
        }

        .du-answer-row .label {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .du-answer-row .oi {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--de);
            background: var(--de-bg);
            border: 1px solid var(--de-border);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
        }

        .du-answer-row .sep {
            color: var(--border);
            font-size: 0.5rem;
        }

        .du-answer-row .answer {
            font-weight: 600;
            color: var(--du);
            font-size: 0.7rem;
        }

        .du-answer-row .expected {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.25);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
        }

        /* Collapsible details - 紧凑 */
        .du-details {
            margin-top: 0.25rem;
        }

        .du-details summary {
            font-size: 0.6rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem 0;
        }

        .du-details summary:hover { color: var(--text-secondary); }

        .du-details[open] summary { margin-bottom: 0.25rem; }

        .du-reasoning {
            font-size: 0.6rem;
            color: var(--text-secondary);
            background: var(--bg-base);
            border-radius: 3px;
            padding: 0.4rem;
            line-height: 1.4;
            max-height: 100px;
            overflow-y: auto;
        }

        /* ========== PAGINATION ========== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.35rem;
            padding: 2rem;
        }

        .page-btn {
            padding: 0.4rem 0.7rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            min-width: 36px;
            text-align: center;
            transition: all 0.2s;
        }

        .page-btn:hover:not(:disabled) {
            background: var(--border-focus);
            border-color: var(--border-focus);
        }

        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-btn.active { background: var(--success); border-color: var(--success); }

        .page-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 0 0.5rem;
        }

        /* ========== MODAL ========== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            cursor: zoom-out;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        .modal-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state .title {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .empty-state .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1600px) {
            .case-content {
                grid-template-columns: var(--sidebar-width) 1fr 1fr;  /* 3 列，DU 换行 */
            }
            .task-panel.du {
                grid-column: 2 / -1;  /* DU 占据下方两列 */
            }
        }

        @media (max-width: 1200px) {
            .case-content {
                grid-template-columns: 1fr 1fr;  /* 2 列 */
            }

            .sidebar {
                grid-column: 1 / -1;  /* 侧边栏占满整行 */
                display: grid;
                grid-template-columns: 150px 1fr;
                gap: 0.75rem;
                align-items: start;
            }

            .sidebar-image { margin-bottom: 0; }

            .task-panel.d2c { grid-column: 1 / 2; }
            .task-panel.de { grid-column: 2 / 3; }
            .task-panel.du { grid-column: 1 / -1; }
        }

        @media (max-width: 900px) {
            .case-content {
                grid-template-columns: 1fr;  /* 单列 */
            }

            .sidebar {
                grid-column: 1;
                grid-template-columns: 120px 1fr;
            }

            .task-panel.d2c,
            .task-panel.de,
            .task-panel.du {
                grid-column: 1;
            }
        }

        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 1rem; }
            .header-stats { justify-content: center; }
            .stats-container { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .filter-container { flex-direction: column; align-items: stretch; }
            .search-box input { width: 100%; }
            .result-count { margin-left: 0; }
            .sidebar { grid-template-columns: 1fr; }
            .de-items { flex-direction: column; }
        }

        /* ========== IMAGE LAZY LOADING ========== */
        img[data-src] {
            opacity: 0;
            transition: opacity 0.3s;
        }

        img.loaded {
            opacity: 1;
        }
    
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>
                <span class="logo">S</span>
                SciDiagram Task Viewer
            </h1>
            <div class="header-stats">
                <div class="header-stat">
                    <div class="header-stat-value" id="header-total">-</div>
                    <div class="header-stat-label">Total Cases</div>
                </div>
            </div>
        </div>
    </header>

    <section class="stats-section">
        <div class="stats-container">
            <div class="stats-grid" id="stats-grid"></div>
            <div class="chart-card">
                <div class="chart-title">Task Distribution</div>
                <div class="chart-wrapper"><canvas id="taskChart"></canvas></div>
            </div>
        </div>
        <!-- DE/DU 子任务类型分布 -->
        <div class="subtask-stats" id="subtask-stats">
            <details class="subtask-panel">
                <summary class="subtask-panel-header">
                    <span class="subtask-panel-title">&#128202; DE/DU Subtask Type Distribution</span>
                    <span class="subtask-panel-hint">Click to expand</span>
                </summary>
                <div class="subtask-panel-body">
                    <div class="subtask-charts">
                        <div class="subtask-chart-card de">
                            <div class="subtask-chart-title">DE Task Types</div>
                            <div class="subtask-chart-wrapper"><canvas id="deTaskChart"></canvas></div>
                            <div class="subtask-list" id="de-task-list"></div>
                        </div>
                        <div class="subtask-chart-card du">
                            <div class="subtask-chart-title">DU Question Types</div>
                            <div class="subtask-chart-wrapper"><canvas id="duTaskChart"></canvas></div>
                            <div class="subtask-list" id="du-task-list"></div>
                        </div>
                    </div>
                    <div class="category-breakdown">
                        <div class="category-breakdown-title">Distribution by Category</div>
                        <div class="category-breakdown-grid" id="category-breakdown-grid"></div>
                    </div>
                </div>
            </details>
        </div>
    </section>

    <section class="filter-section">
        <div class="filter-container">
            <div class="filter-group">
                <span class="filter-label">Category</span>
                <div class="dropdown" id="category-dropdown">
                    <div class="dropdown-toggle" onclick="toggleDropdown()">
                        <span class="text">Select categories...</span>
                        <span class="arrow">&#9662;</span>
                    </div>
                    <div class="dropdown-menu" id="category-menu">
                        <div id="category-items"></div>
                        <div class="dropdown-actions">
                            <button onclick="selectAllCategories()">All</button>
                            <button onclick="clearAllCategories()">Clear</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search ID or content...">
            </div>

            <select class="per-page-select" id="per-page">
                <option value="20">20 / page</option>
                <option value="50" selected>50 / page</option>
                <option value="100">100 / page</option>
                <option value="9999">All</option>
            </select>

            <span class="result-count" id="result-count"></span>
        </div>
    </section>

    <div class="main-content">
        <div class="items-list" id="items-list"></div>
    </div>

    <div class="pagination" id="pagination"></div>

    <div class="modal" id="image-modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modal-image">
        <div class="modal-info" id="modal-info"></div>
    </div>

    <script>
        // Data injection
        const DATA_URL = 'https://online-image-2512.oss-cn-beijing.aliyuncs.com/question_generator/run_20260215_022221_filtered_v3/data.json';
        let DATA = [];
        const STATS_URL = 'https://online-image-2512.oss-cn-beijing.aliyuncs.com/question_generator/run_20260215_022221_filtered_v3/stats.json';
        let STATS = {};

        // State
        let filteredData = [...DATA];
        let currentPage = 1;
        let itemsPerPage = 50;
        let activeCategories = new Set();
        let dropdownOpen = false;

        // Image lazy loading
        const imageObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    if (img.dataset.src) {
                        img.src = img.dataset.src;
                        img.onload = () => img.classList.add('loaded');
                        img.onerror = () => {
                            img.parentElement.innerHTML = '<span style="color:var(--text-muted);font-size:0.8rem;">Image not available</span>';
                        };
                        delete img.dataset.src;
                    }
                    imageObserver.unobserve(img);
                }
            });
        }, { rootMargin: '200px 0px', threshold: 0.01 });

        function observeImages() {
            document.querySelectorAll('img[data-src]').forEach(img => {
                imageObserver.observe(img);
            });
        }

        // Loading UI
        function showLoading(msg) {
            document.getElementById('items-list').innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:400px;color:var(--text-muted);">
                    <div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1rem;"></div>
                    <div>${msg}</div>
                </div>
            `;
        }

        function showError(msg) {
            document.getElementById('items-list').innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:400px;color:var(--error);">
                    <div style="font-size:3rem;margin-bottom:1rem;">✕</div>
                    <div style="font-size:1.2rem;margin-bottom:0.5rem;">Failed to load data</div>
                    <div style="color:var(--text-muted);margin-bottom:1rem;">${msg}</div>
                    <button onclick="loadData()" style="padding:0.5rem 1rem;background:var(--accent);border:none;border-radius:4px;color:white;cursor:pointer;">Retry</button>
                </div>
            `;
        }

        // Async data loading
        async function loadData() {
            try {
                showLoading('Loading statistics...');

                // Load stats first (smaller)
                const statsRes = await fetch(STATS_URL);
                if (!statsRes.ok) throw new Error('Failed to fetch stats: ' + statsRes.status);
                STATS = await statsRes.json();

                // Render stats immediately
                renderStats();
                renderChart();
                renderSubtaskStats();

                showLoading('Loading data (' + STATS.total + ' items)...');

                // Load main data
                const dataRes = await fetch(DATA_URL);
                if (!dataRes.ok) throw new Error('Failed to fetch data: ' + dataRes.status);
                DATA = await dataRes.json();
                filteredData = [...DATA];

                // Initialize UI
                renderFilters();
                applyFilters();
                setupEventListeners();

            } catch (err) {
                console.error('Load error:', err);
                showError(err.message);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadData();

            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('category-dropdown');
                if (dropdown && !dropdown.contains(e.target)) closeDropdown();
            });
        });

        function renderStats() {
            const tc = STATS.task_counts;
            document.getElementById('header-total').textContent = STATS.total.toLocaleString();

            document.getElementById('stats-grid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value total">${STATS.total.toLocaleString()}</div>
                    <div class="stat-label">Total Cases</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value d2c">${tc.d2c.total.toLocaleString()}</div>
                    <div class="stat-label">D2C Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value de">${tc.de.items_total.toLocaleString()}</div>
                    <div class="stat-label">DE Sub-tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value du">${tc.du.items_total.toLocaleString()}</div>
                    <div class="stat-label">DU Questions</div>
                </div>
            `;
        }

        function renderChart() {
            const tc = STATS.task_counts;
            new Chart(document.getElementById('taskChart'), {
                type: 'bar',
                data: {
                    labels: ['D2C', 'DE Items', 'DU Items'],
                    datasets: [{
                        label: 'Success',
                        data: [tc.d2c.success, tc.de.success, tc.du.success],
                        backgroundColor: '#10b981'
                    }, {
                        label: 'Total',
                        data: [tc.d2c.total, tc.de.items_total, tc.du.items_total],
                        backgroundColor: '#1e2832'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
                    scales: {
                        x: { ticks: { color: '#64748b' }, grid: { display: false } },
                        y: { ticks: { color: '#64748b' }, grid: { color: '#1e2832' } }
                    }
                }
            });
        }

        // Color palette for pie charts
        const PIE_COLORS = [
            '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899',
            '#f59e0b', '#84cc16', '#ef4444', '#14b8a6', '#a855f7',
            '#f97316', '#22c55e', '#0ea5e9', '#d946ef', '#eab308'
        ];

        function renderSubtaskStats() {
            const deTypes = STATS.de_task_types || {};
            const duTypes = STATS.du_task_types || {};
            const categoryStats = STATS.category_task_stats || {};

            // Skip if no subtask data
            if (Object.keys(deTypes).length === 0 && Object.keys(duTypes).length === 0) {
                document.getElementById('subtask-stats').innerHTML = '';
                return;
            }

            // Sort task types by count (descending)
            const sortedDE = Object.entries(deTypes).sort((a, b) => b[1] - a[1]);
            const sortedDU = Object.entries(duTypes).sort((a, b) => b[1] - a[1]);
            const deTotal = sortedDE.reduce((sum, [, count]) => sum + count, 0);
            const duTotal = sortedDU.reduce((sum, [, count]) => sum + count, 0);

            // Build DE list items
            const deListHtml = sortedDE.map(([name, count]) => {
                const pct = deTotal > 0 ? ((count / deTotal) * 100).toFixed(1) : '0.0';
                return `<div class="subtask-list-item">
                    <span class="name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
                    <span class="count">${count}</span>
                    <span class="percent">(${pct}%)</span>
                </div>`;
            }).join('');

            // Build DU list items
            const duListHtml = sortedDU.map(([name, count]) => {
                const pct = duTotal > 0 ? ((count / duTotal) * 100).toFixed(1) : '0.0';
                return `<div class="subtask-list-item">
                    <span class="name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
                    <span class="count">${count}</span>
                    <span class="percent">(${pct}%)</span>
                </div>`;
            }).join('');

            // Build category breakdown with pie charts
            const categoryOrder = ['charts', 'planar_geometry', '3d_shapes&geometry', 'graph_structures', 'circuit_diagrams', 'chemical_expressions'];
            const sortedCategories = Object.entries(categoryStats).sort((a, b) => {
                const ia = categoryOrder.indexOf(a[0]);
                const ib = categoryOrder.indexOf(b[0]);
                if (ia === -1 && ib === -1) return a[0].localeCompare(b[0]);
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });

            const categoryBreakdownHtml = sortedCategories.map(([cat, catStats], idx) => {
                const deItems = Object.entries(catStats.de || {}).sort((a, b) => b[1] - a[1]);
                const duItems = Object.entries(catStats.du || {}).sort((a, b) => b[1] - a[1]);
                const catDeTotal = deItems.reduce((sum, [, c]) => sum + c, 0);
                const catDuTotal = duItems.reduce((sum, [, c]) => sum + c, 0);

                const safeId = cat.replace(/[^a-zA-Z0-9]/g, '_');

                return `<div class="category-breakdown-item">
                    <div class="category-breakdown-item-header">
                        ${cat}
                        <span class="cat-count">${catDeTotal + catDuTotal} tasks</span>
                    </div>
                    <div class="category-breakdown-charts">
                        <div class="category-chart-section">
                            <div class="category-chart-section-title de">DE (${catDeTotal})</div>
                            <div class="category-pie-wrapper">
                                <canvas id="catDePie_${safeId}"></canvas>
                            </div>
                        </div>
                        <div class="category-chart-section">
                            <div class="category-chart-section-title du">DU (${catDuTotal})</div>
                            <div class="category-pie-wrapper">
                                <canvas id="catDuPie_${safeId}"></canvas>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            // Render the full panel (always expanded, no <details>)
            document.getElementById('subtask-stats').innerHTML = `
                <div class="subtask-panel">
                    <div class="subtask-panel-header">
                        <span class="subtask-panel-title">📊 Task Type Distribution</span>
                    </div>
                    <div class="subtask-panel-body">
                        <div class="subtask-charts">
                            <div class="subtask-chart-card de">
                                <div class="subtask-chart-header">
                                    <span class="subtask-chart-title">DE Task Types</span>
                                    <span class="subtask-chart-total">${deTotal} total</span>
                                </div>
                                <div class="subtask-chart-content">
                                    <div class="subtask-bar-wrapper">
                                        <canvas id="deSubtaskBarChart"></canvas>
                                    </div>
                                    <div class="subtask-pie-wrapper">
                                        <canvas id="deSubtaskPieChart"></canvas>
                                        <div class="subtask-pie-label">Top ${Math.min(sortedDE.length, 8)} types</div>
                                    </div>
                                </div>
                                <div class="subtask-list">${deListHtml || '<div class="no-data-hint">No DE tasks</div>'}</div>
                            </div>
                            <div class="subtask-chart-card du">
                                <div class="subtask-chart-header">
                                    <span class="subtask-chart-title">DU Question Types</span>
                                    <span class="subtask-chart-total">${duTotal} total</span>
                                </div>
                                <div class="subtask-chart-content">
                                    <div class="subtask-bar-wrapper">
                                        <canvas id="duSubtaskBarChart"></canvas>
                                    </div>
                                    <div class="subtask-pie-wrapper">
                                        <canvas id="duSubtaskPieChart"></canvas>
                                        <div class="subtask-pie-label">Top ${Math.min(sortedDU.length, 8)} types</div>
                                    </div>
                                </div>
                                <div class="subtask-list">${duListHtml || '<div class="no-data-hint">No DU tasks</div>'}</div>
                            </div>
                        </div>
                        <div class="category-breakdown">
                            <div class="category-breakdown-title">Distribution by Category</div>
                            <div class="category-breakdown-grid">${categoryBreakdownHtml}</div>
                        </div>
                    </div>
                </div>
            `;

            // Render charts after DOM is ready
            setTimeout(() => {
                // Main bar charts
                renderSubtaskBarChart('deSubtaskBarChart', sortedDE.slice(0, 10), '#10b981');
                renderSubtaskBarChart('duSubtaskBarChart', sortedDU.slice(0, 10), '#8b5cf6');

                // Main pie charts
                renderSubtaskPieChart('deSubtaskPieChart', sortedDE.slice(0, 8), deTotal);
                renderSubtaskPieChart('duSubtaskPieChart', sortedDU.slice(0, 8), duTotal);

                // Category mini pie charts
                sortedCategories.forEach(([cat, catStats]) => {
                    const deItems = Object.entries(catStats.de || {}).sort((a, b) => b[1] - a[1]);
                    const duItems = Object.entries(catStats.du || {}).sort((a, b) => b[1] - a[1]);
                    const safeId = cat.replace(/[^a-zA-Z0-9]/g, '_');

                    renderCategoryPieChart(`catDePie_${safeId}`, deItems.slice(0, 6));
                    renderCategoryPieChart(`catDuPie_${safeId}`, duItems.slice(0, 6));
                });
            }, 0);
        }

        function renderSubtaskBarChart(canvasId, data, barColor) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || data.length === 0) return;

            const labels = data.map(([name]) => name.split(':')[0].trim());
            const values = data.map(([, count]) => count);

            new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: barColor,
                        borderRadius: 3,
                        barThickness: 14
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (items) => data[items[0].dataIndex]?.[0] || '',
                                label: (item) => `Count: ${item.raw}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#64748b', font: { size: 9 } },
                            grid: { color: '#1e2832' }
                        },
                        y: {
                            ticks: { color: '#94a3b8', font: { size: 9 } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function renderSubtaskPieChart(canvasId, data, total) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || data.length === 0) return;

            const labels = data.map(([name]) => name.split(':')[0].trim());
            const fullNames = data.map(([name]) => name);
            const values = data.map(([, count]) => count);

            new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: PIE_COLORS.slice(0, data.length),
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    cutout: '50%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (items) => fullNames[items[0].dataIndex] || '',
                                label: (item) => {
                                    const pct = total > 0 ? ((item.raw / total) * 100).toFixed(1) : '0.0';
                                    return `${item.raw} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderCategoryPieChart(canvasId, data) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            if (data.length === 0) {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#334155';
                ctx.font = '10px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No data', canvas.width / 2, canvas.height / 2);
                return;
            }

            const labels = data.map(([name]) => name.split(':')[0].trim());
            const fullNames = data.map(([name]) => name);
            const values = data.map(([, count]) => count);
            const total = values.reduce((a, b) => a + b, 0);

            new Chart(canvas, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: PIE_COLORS.slice(0, data.length),
                        borderWidth: 1,
                        borderColor: '#1a1f2e'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (items) => fullNames[items[0].dataIndex] || '',
                                label: (item) => {
                                    const pct = total > 0 ? ((item.raw / total) * 100).toFixed(1) : '0.0';
                                    return `${item.raw} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderFilters() {
            const categoryOrder = ['charts', 'planar_geometry', '3d_shapes&geometry', 'graph_structures', 'circuit_diagrams', 'chemical_expressions'];
            const categories = Object.entries(STATS.categories).sort((a, b) => {
                const ia = categoryOrder.indexOf(a[0]);
                const ib = categoryOrder.indexOf(b[0]);
                if (ia === -1 && ib === -1) return b[1] - a[1];
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });

            document.getElementById('category-items').innerHTML = categories.map(([cat, count]) => `
                <label class="dropdown-item" onclick="event.stopPropagation()">
                    <input type="checkbox" ${activeCategories.has(cat) ? 'checked' : ''} onchange="toggleCategory('${cat}')">
                    <span class="name">${cat}</span>
                    <span class="count">${count}</span>
                </label>
            `).join('');

            updateDropdownText();
        }

        function toggleDropdown() {
            const menu = document.getElementById('category-menu');
            const toggle = document.querySelector('.dropdown-toggle');
            dropdownOpen = !dropdownOpen;
            menu.classList.toggle('show', dropdownOpen);
            toggle.classList.toggle('open', dropdownOpen);
        }

        function closeDropdown() {
            document.getElementById('category-menu').classList.remove('show');
            document.querySelector('.dropdown-toggle').classList.remove('open');
            dropdownOpen = false;
        }

        function toggleCategory(cat) {
            activeCategories.has(cat) ? activeCategories.delete(cat) : activeCategories.add(cat);
            updateDropdownText();
            currentPage = 1;
            applyFilters();
        }

        function selectAllCategories() {
            Object.keys(STATS.categories).forEach(cat => activeCategories.add(cat));
            renderFilters();
            currentPage = 1;
            applyFilters();
        }

        function clearAllCategories() {
            activeCategories.clear();
            renderFilters();
            currentPage = 1;
            applyFilters();
        }

        function updateDropdownText() {
            const toggle = document.querySelector('.dropdown-toggle');
            const text = toggle.querySelector('.text');
            const total = Object.keys(STATS.categories).length;
            const selected = activeCategories.size;

            if (selected === 0) {
                text.textContent = 'Select categories...';
                toggle.classList.remove('active');
            } else if (selected === total) {
                text.textContent = `All (${total})`;
                toggle.classList.add('active');
            } else {
                const names = [...activeCategories].slice(0, 2).join(', ');
                text.textContent = selected > 2 ? `${names} +${selected - 2}` : names;
                toggle.classList.add('active');
            }
        }

        function setupEventListeners() {
            let timeout;
            document.getElementById('search-input').addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(() => { currentPage = 1; applyFilters(); }, 300);
            });

            document.getElementById('per-page').addEventListener('change', e => {
                itemsPerPage = parseInt(e.target.value);
                currentPage = 1;
                render();
            });
        }

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();

            filteredData = DATA.filter(item => {
                if (item.category && !activeCategories.has(item.category)) return false;
                if (item.processing_status !== 'success') return false;
                if (search) {
                    const searchable = `${item.id} ${item.category} ${JSON.stringify(item.tasks)}`.toLowerCase();
                    if (!searchable.includes(search)) return false;
                }
                return true;
            });

            render();
        }

        function render() {
            renderItems();
            renderPagination();
            document.getElementById('result-count').textContent =
                activeCategories.size === 0 ? 'No category selected' : `${filteredData.length} results`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getImageSrc(item, type, index = 0) {
            if (type === 'original') {
                return item.original_image_data || item.original_image_url || item.original_image_path || '';
            }
            if (item.rendered_images) {
                if (type === 'd2c') return item.rendered_images.d2c || '';
                if (type === 'de' && item.rendered_images.de) return item.rendered_images.de[index] || '';
            }
            return '';
        }

        function renderItems() {
            if (activeCategories.size === 0) {
                document.getElementById('items-list').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">&#128202;</div>
                        <div class="title">Select categories to view cases</div>
                        <div class="subtitle">Use the dropdown above to select one or more categories</div>
                    </div>
                `;
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const pageData = filteredData.slice(start, start + itemsPerPage);

            if (pageData.length === 0) {
                document.getElementById('items-list').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">&#128269;</div>
                        <div class="title">No matching results</div>
                        <div class="subtitle">Try adjusting your search or filters</div>
                    </div>
                `;
                return;
            }

            const html = pageData.map((item, idx) => {
                const cardId = `case-${start + idx}`;
                const tasks = item.tasks || {};
                const originalImg = getImageSrc(item, 'original');
                const codeLines = item.code ? item.code.split('\n').length : 0;

                // D2C Panel
                let d2cHtml = '';
                if (tasks.d2c) {
                    const d2c = tasks.d2c;
                    const d2cImg = getImageSrc(item, 'd2c');
                    d2cHtml = `
                        <div class="task-panel d2c">
                            <div class="panel-header d2c">
                                <span class="task-type d2c">&#128221; D2C - Diagram to Code</span>
                                <span class="badge ${d2c.status === 'success' ? 'badge-success' : 'badge-failed'}">${d2c.status}</span>
                            </div>
                            <div class="panel-body">
                                <div class="d2c-content">
                                    <div class="code-toggle" onclick="toggleCode('${cardId}-d2c-q')">
                                        <span class="tag q">Q</span>
                                        <span class="text">Question Prompt</span>
                                        <span class="arrow">&#9662;</span>
                                    </div>
                                    <div class="code-content" id="${cardId}-d2c-q">${escapeHtml(d2c.question)}</div>

                                    <div class="code-toggle" onclick="toggleCode('${cardId}-d2c-a')">
                                        <span class="tag a">A</span>
                                        <span class="text">Answer Code</span>
                                        <span class="arrow">&#9662;</span>
                                    </div>
                                    <div class="code-content" id="${cardId}-d2c-a">${escapeHtml(d2c.answer_code)}</div>

                                    ${d2cImg ? `
                                    <div class="render-preview" onclick="openModal('${d2cImg}', 'D2C Rendered')">
                                        <img data-src="${d2cImg}" alt="D2C Rendered">
                                        <div class="render-label">D2C Rendered Result</div>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>
