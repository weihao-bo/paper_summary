                        </div>
                    `;
                }

                // DE Panel
                let deHtml = '';
                if (tasks.de && tasks.de.items && tasks.de.items.length > 0) {
                    const deItems = tasks.de.items.map((de, i) => {
                        if (!de) return '';
                        const deImg = getImageSrc(item, 'de', i);
                        const answerCode = de.answer?.code || '';
                        const changesMade = de.answer?.changes_made || [];
                        const compileError = de.compile_error || '';
                        const reasoning = de.reasoning || '';
                        const renderStatus = de.render_status || '';
                        const question = de.question || '';
                        const deItemId = `${cardId}-de-${i}`;

                        // Render area: success shows image, failed shows error
                        let renderHtml = '';
                        if (deImg) {
                            renderHtml = `
                                <div class="de-render" onclick="openModal('${deImg}', 'DE: ${de.task_id}')">
                                    <img data-src="${deImg}" alt="DE Rendered">
                                </div>`;
                        } else if (renderStatus === 'failed' || compileError) {
                            renderHtml = `
                                <div class="de-render-error">
                                    <span class="icon">⚠️</span>
                                    <div>渲染失败</div>
                                    ${compileError ? `<div class="msg">${escapeHtml(compileError.substring(0, 100))}...</div>` : ''}
                                </div>`;
                        }

                        return `
                            <div class="de-item">
                                <div class="de-item-header">
                                    <span class="num">${i + 1}</span>
                                    <span class="task-id">${de.task_id || ''}</span>
                                    <span class="task-name" title="${escapeHtml(de.task_name || '')}">${de.task_name || ''}</span>
                                    ${de.dimension ? `<span class="dim-badge dim-${de.dimension}">${de.dimension}</span>` : ''}
                                </div>
                                <div class="de-item-body">
                                    <div class="de-instruction">${escapeHtml(de.edit_instruction)}</div>
                                    ${question ? `
                                    <div class="code-toggle" onclick="toggleCode('${deItemId}-q')">
                                        <span class="tag q">Q</span>
                                        <span class="text">Question Prompt</span>
                                        <span class="arrow">&#9662;</span>
                                    </div>
                                    <div class="code-content" id="${deItemId}-q">${escapeHtml(question)}</div>
                                    ` : ''}
                                    ${reasoning ? `
                                    <div class="code-toggle" onclick="toggleCode('${deItemId}-r')">
                                        <span class="tag r">R</span>
                                        <span class="text">Reasoning</span>
                                        <span class="arrow">&#9662;</span>
                                    </div>
                                    <div class="code-content" id="${deItemId}-r">${escapeHtml(reasoning)}</div>
                                    ` : ''}
                                    ${answerCode ? `
                                    <div class="code-toggle" onclick="toggleCode('${deItemId}-a')">
                                        <span class="tag a">A</span>
                                        <span class="text">Answer Code${changesMade.length > 0 ? ` (${changesMade.length} changes)` : ''}</span>
                                        <span class="arrow">&#9662;</span>
                                    </div>
                                    <div class="code-content" id="${deItemId}-a"><pre style="margin:0;white-space:pre-wrap;">${escapeHtml(answerCode)}</pre>${changesMade.length > 0 ? `<div style="margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid var(--border-subtle);"><strong>Changes:</strong> ${changesMade.map(c => escapeHtml(c)).join('; ')}</div>` : ''}</div>
                                    ` : ''}
                                    ${renderHtml}
                                </div>
                            </div>
                        `;
                    }).join('');

                    deHtml = `
                        <div class="task-panel de">
                            <div class="panel-header de">
                                <span class="task-type de">&#9999; DE - Diagram Editing</span>
                                <span class="task-count">${tasks.de.items.length} tasks</span>
                            </div>
                            <div class="panel-body">
                                <div class="de-items">${deItems}</div>
                            </div>
                        </div>
                    `;
                }

                // DU Panel
                let duHtml = '';
                if (tasks.du && tasks.du.items && tasks.du.items.length > 0) {
                    const duItems = tasks.du.items.map((du, i) => {
                        if (!du) return '';
                        const duItemId = `${cardId}-du-${i}`;
                        const question = du.question || '';
                        const reasoning = du.answer?.reasoning || '';
                        const codeRef = du.answer?.code_reference || '';

                        return `
                            <div class="du-item">
                                <div class="du-item-header">
                                    <span class="num">${i + 1}</span>
                                    <span class="task-id">${du.question_id || ''}</span>
                                    <span class="task-name" title="${escapeHtml(du.question_name || '')}">${du.question_name || ''}</span>
                                    ${du.question_type ? `<span class="type">${du.question_type}</span>` : ''}
                                </div>
                                <div class="du-question">${escapeHtml(du.instantiated_question)}</div>
                                <div class="du-answer-row">
                                    <span class="label">Output:</span>
                                    <code class="oi">${du.output_instruction || '-'}</code>
                                    ${du.expected_answer_type ? `
                                    <span class="sep">|</span>
                                    <span class="label">Expected:</span>
                                    <span class="expected">${du.expected_answer_type}</span>
                                    ` : ''}
                                    <span class="sep">|</span>
                                    <span class="label">Answer:</span>
                                    <span class="answer">${escapeHtml(du.answer?.answer || '-')}</span>
                                </div>
                                ${question ? `
                                <div class="code-toggle" onclick="toggleCode('${duItemId}-q')">
                                    <span class="tag q">Q</span>
                                    <span class="text">Question Prompt</span>
                                    <span class="arrow">&#9662;</span>
                                </div>
                                <div class="code-content" id="${duItemId}-q">${escapeHtml(question)}</div>
                                ` : ''}
                                ${reasoning ? `
                                <div class="code-toggle" onclick="toggleCode('${duItemId}-r')">
                                    <span class="tag r">R</span>
                                    <span class="text">Reasoning</span>
                                    <span class="arrow">&#9662;</span>
                                </div>
                                <div class="code-content" id="${duItemId}-r">${escapeHtml(reasoning)}</div>
                                ` : ''}
                                ${codeRef ? `
                                <div class="code-toggle" onclick="toggleCode('${duItemId}-c')">
                                    <span class="tag c">C</span>
                                    <span class="text">Code Reference</span>
                                    <span class="arrow">&#9662;</span>
                                </div>
                                <div class="code-content" id="${duItemId}-c"><pre style="margin:0;white-space:pre-wrap;">${escapeHtml(codeRef)}</pre></div>
                                ` : ''}
                            </div>
                        `;
                    }).join('');

                    duHtml = `
                        <div class="task-panel du">
                            <div class="panel-header du">
                                <span class="task-type du">&#129504; DU - Diagram Understanding</span>
                                <span class="task-count">${tasks.du.items.length} questions</span>
                            </div>
                            <div class="panel-body">
                                <div class="du-items">${duItems}</div>
                            </div>
                        </div>
                    `;
                }

                // Package tags
                const packagesHtml = (item.packages_used || []).map(p =>
                    `<span class="package-tag">${escapeHtml(p)}</span>`
                ).join('');

                return `
                    <div class="case-card" id="${cardId}">
                        <div class="case-header">
                            <span class="case-id">${item.id}</span>
                            <div class="case-badges">
                                <span class="badge badge-category">${item.category}</span>
                                <span class="badge badge-${item.processing_status}">${item.processing_status}</span>
                            </div>
                        </div>
                        <div class="case-content">
                            <aside class="sidebar">
                                ${originalImg ? `
                                <div class="sidebar-image" onclick="openModal('${originalImg}', 'Original: ${item.id}')">
                                    <img data-src="${originalImg}" alt="Original">
                                </div>
                                ` : '<div style="padding:2rem;text-align:center;color:var(--text-muted);">No image</div>'}
                                <div class="sidebar-info">
                                    <div class="info-row">
                                        <span class="label">Source</span>
                                        <span class="value">${item.source_file || '-'}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">Package</span>
                                        <span class="value highlight">${item.source_package || '-'}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">Lines</span>
                                        <span class="value">${codeLines}</span>
                                    </div>
                                    ${packagesHtml ? `
                                    <div class="info-row">
                                        <span class="label">LaTeX</span>
                                        <div class="package-tags">${packagesHtml}</div>
                                    </div>
                                    ` : ''}
                                </div>
                                ${item.code ? `
                                <details class="sidebar-code">
                                    <summary>&#128196; Original Code (${codeLines} lines)</summary>
                                    <pre>${escapeHtml(item.code)}</pre>
                                </details>
                                ` : ''}
                            </aside>
                            ${d2cHtml || '<div class="task-panel d2c empty"><div class="panel-header d2c"><span class="task-type d2c">📝 D2C</span></div><div class="panel-body empty-hint">No D2C task</div></div>'}
                            ${deHtml || '<div class="task-panel de empty"><div class="panel-header de"><span class="task-type de">✏️ DE</span></div><div class="panel-body empty-hint">No DE tasks</div></div>'}
                            ${duHtml || '<div class="task-panel du empty"><div class="panel-header du"><span class="task-type du">🧠 DU</span></div><div class="panel-body empty-hint">No DU questions</div></div>'}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('items-list').innerHTML = html;
            observeImages();
        }

        function toggleCode(id) {
            const el = document.getElementById(id);
            const toggle = el.previousElementSibling;
            if (el) {
                el.classList.toggle('show');
                toggle.classList.toggle('open');
            }
        }

        function toggleDeQuestion(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('show');
            }
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let html = `
                <button class="page-btn" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>First</button>
                <button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>
            `;

            const start = Math.max(1, currentPage - 2);
            const end = Math.min(totalPages, currentPage + 2);

            if (start > 1) html += '<span class="page-info">...</span>';
            for (let i = start; i <= end; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            if (end < totalPages) html += '<span class="page-info">...</span>';

            html += `
                <button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
                <button class="page-btn" onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>Last</button>
                <span class="page-info">${currentPage} / ${totalPages}</span>
            `;

            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            render();
            window.scrollTo({ top: document.querySelector('.filter-section').offsetTop, behavior: 'smooth' });
        }

        function openModal(src, info) {
            document.getElementById('modal-image').src = src;
            document.getElementById('modal-info').textContent = info;
            document.getElementById('image-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('image-modal').classList.remove('active');
        }

        document.getElementById('image-modal').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
